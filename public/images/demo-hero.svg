<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="A camper scanning a RoadWave QR code at a campground front desk" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16203a"/>
      <stop offset="1" stop-color="#0a0f1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.22" r="0.6">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f6f45"/>
      <stop offset="1" stop-color="#14502f"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <rect width="800" height="600" fill="url(#glow)"/>

  <!-- moon / warm light -->
  <circle cx="640" cy="138" r="50" fill="#f5ecd9" opacity="0.92"/>
  <circle cx="640" cy="138" r="86" fill="#f59e0b" opacity="0.12"/>

  <!-- stars -->
  <g fill="#f5ecd9" opacity="0.55">
    <circle cx="110" cy="80" r="2"/>
    <circle cx="210" cy="56" r="1.6"/>
    <circle cx="330" cy="96" r="1.6"/>
    <circle cx="470" cy="64" r="2"/>
    <circle cx="540" cy="120" r="1.4"/>
    <circle cx="92" cy="180" r="1.6"/>
    <circle cx="730" cy="250" r="1.6"/>
  </g>

  <!-- back hills -->
  <path d="M0 420 C160 372 300 400 440 400 C560 400 680 382 800 402 L800 600 L0 600 Z" fill="#133f28" opacity="0.7"/>
  <!-- front ground -->
  <path d="M0 478 C200 440 320 470 470 476 C600 481 700 470 800 474 L800 600 L0 600 Z" fill="url(#ground)"/>

  <!-- camper van (left) -->
  <g transform="translate(40,396)">
    <rect x="0" y="0" width="186" height="96" rx="20" fill="#f5ecd9"/>
    <rect x="0" y="52" width="186" height="44" rx="20" fill="#e7dcc2"/>
    <rect x="14" y="16" width="64" height="38" rx="7" fill="#16203a"/>
    <rect x="90" y="16" width="40" height="38" rx="7" fill="#16203a"/>
    <rect x="0" y="36" width="186" height="9" fill="#f59e0b"/>
    <circle cx="44" cy="100" r="18" fill="#0a0f1c"/>
    <circle cx="44" cy="100" r="7" fill="#94a3b8"/>
    <circle cx="146" cy="100" r="18" fill="#0a0f1c"/>
    <circle cx="146" cy="100" r="7" fill="#94a3b8"/>
  </g>

  <!-- pine tree (left, beside van) -->
  <g transform="translate(252,346)">
    <rect x="-6" y="118" width="12" height="36" rx="3" fill="#6b4423"/>
    <path d="M0 0 L44 70 L-44 70 Z" fill="#1f6f45"/>
    <path d="M0 36 L52 120 L-52 120 Z" fill="#1a5d3a"/>
  </g>

  <!-- tent (right) -->
  <g transform="translate(612,398)">
    <path d="M0 0 L68 78 L-68 78 Z" fill="#f59e0b"/>
    <path d="M0 20 L22 78 L-22 78 Z" fill="#16203a"/>
    <path d="M0 0 L-6 78 M0 0 L6 78" stroke="#c2410c" stroke-width="3"/>
  </g>

  <!-- pine tree (right, behind tent) -->
  <g transform="translate(720,352)">
    <rect x="-5" y="104" width="10" height="32" rx="3" fill="#6b4423"/>
    <path d="M0 0 L38 60 L-38 60 Z" fill="#1f6f45"/>
    <path d="M0 30 L46 102 L-46 102 Z" fill="#1a5d3a"/>
  </g>

  <!-- phone (center) showing the RoadWave QR welcome page -->
  <g transform="translate(0,0)">
    <rect x="300" y="110" width="200" height="372" rx="34" fill="#0a0f1c" stroke="#2a3550" stroke-width="3"/>
    <rect x="316" y="128" width="168" height="336" rx="22" fill="#0f1830"/>
    <rect x="372" y="120" width="56" height="8" rx="4" fill="#1a2440"/>

    <!-- QR card -->
    <rect x="344" y="166" width="112" height="112" rx="10" fill="#f5ecd9"/>
    <g fill="#0a0f1c">
      <!-- finder TL -->
      <rect x="352" y="174" width="28" height="28"/>
      <rect x="358" y="180" width="16" height="16" fill="#f5ecd9"/>
      <rect x="363" y="185" width="6" height="6"/>
      <!-- finder TR -->
      <rect x="420" y="174" width="28" height="28"/>
      <rect x="426" y="180" width="16" height="16" fill="#f5ecd9"/>
      <rect x="431" y="185" width="6" height="6"/>
      <!-- finder BL -->
      <rect x="352" y="242" width="28" height="28"/>
      <rect x="358" y="248" width="16" height="16" fill="#f5ecd9"/>
      <rect x="363" y="253" width="6" height="6"/>
      <!-- data modules -->
      <rect x="390" y="176" width="8" height="8"/>
      <rect x="402" y="176" width="8" height="8"/>
      <rect x="390" y="188" width="8" height="8"/>
      <rect x="412" y="176" width="8" height="8"/>
      <rect x="390" y="212" width="8" height="8"/>
      <rect x="402" y="212" width="8" height="8"/>
      <rect x="414" y="212" width="8" height="8"/>
      <rect x="426" y="212" width="8" height="8"/>
      <rect x="438" y="212" width="8" height="8"/>
      <rect x="364" y="212" width="8" height="8"/>
      <rect x="390" y="224" width="8" height="8"/>
      <rect x="390" y="248" width="8" height="8"/>
      <rect x="390" y="260" width="8" height="8"/>
      <rect x="402" y="248" width="8" height="8"/>
      <rect x="414" y="260" width="8" height="8"/>
      <rect x="426" y="248" width="8" height="8"/>
      <rect x="438" y="260" width="8" height="8"/>
      <rect x="426" y="236" width="8" height="8"/>
      <rect x="438" y="224" width="8" height="8"/>
      <rect x="414" y="248" width="8" height="8"/>
    </g>

    <!-- scan line -->
    <rect x="344" y="220" width="112" height="4" fill="#f59e0b" opacity="0.55"/>

    <!-- scan corners -->
    <g stroke="#f59e0b" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M334 182 V166 q0 -6 6 -6 H356"/>
      <path d="M444 160 H460 q6 0 6 6 V182"/>
      <path d="M334 262 V278 q0 6 6 6 H356"/>
      <path d="M444 284 H460 q6 0 6 -6 V262"/>
    </g>

    <!-- green CTA pill + text lines -->
    <rect x="348" y="300" width="104" height="30" rx="15" fill="#1f6f45"/>
    <rect x="368" y="312" width="64" height="6" rx="3" fill="#f5ecd9" opacity="0.9"/>
    <rect x="348" y="346" width="104" height="8" rx="4" fill="#94a3b8" opacity="0.55"/>
    <rect x="348" y="362" width="74" height="8" rx="4" fill="#94a3b8" opacity="0.4"/>
  </g>
</svg>
