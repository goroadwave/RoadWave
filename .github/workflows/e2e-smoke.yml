  name: e2e-smoke

  # Smoke suite against the live RoadWave deployment. Read-only, no real
  # signups, no real Stripe charges. Safe to run repeatedly.
  #
  # Triggers:
  #   workflow_dispatch — manual run, optional target URL override.
  #   schedule          — daily probe (drift / dependency-rot detector).
  #   push to main      — runs after merge so we know whether the deploy
  #                       actually broke anything user-visible. Includes
  #                       a short wait to give Vercel time to roll the
  #                       new build before we probe.
  #
  # Notes:
  #   - Tests live in tests/smoke.test.js (canonical) and target the URL
  #     in PLAYWRIGHT_BASE_URL or the input/default below.
  #   - Failures upload the Playwright HTML report as an artifact for
  #     post-mortem.
  #   - This workflow does NOT gate merges on its own. Add a branch
  #     protection rule referencing this check if you want pre-merge
  #     gating, OR add a pull_request trigger pointed at a preview URL
  #     once the deployment_status flow is back in service.

  on:
    workflow_dispatch:
      inputs:
        target_url:
          description: "Base URL to probe (defaults to www.getroadwave.com)"
          required: false
          default: "https://www.getroadwave.com"
    schedule:
      # 07:17 UTC daily — off-the-hour to avoid Actions queue pile-ups.
      - cron: "17 7 * * *"
    push:
      branches: [main]
      paths-ignore:
        - "**.md"
        - "docs/**"
        - ".github/**"

  # Explicit least-privilege token scope. Checkout only needs to READ
  # the repo, so we pin contents:read here rather than relying on the
  # account/repo default. NOTE: this does NOT address the current CI
  # failure — checkout is failing with "remote: Your account is
  # suspended ... error: 403", which GitHub's git server returns based
  # on ACCOUNT STATUS before token scope is ever evaluated. No token
  # permission can override a suspended-account 403; the account must
  # be reinstated via GitHub Support. This block is correctness/hardening.
  permissions:
    contents: read

  concurrency:
    group: e2e-smoke-${{ github.ref }}
    cancel-in-progress: false

  jobs:
    smoke:
      runs-on: ubuntu-latest
      # 20-minute cap covers the slower mobile-safari (WebKit) project
      # alongside chromium. Was 15; bumped 2026-05-21 when both
      # browsers became required for smoke to pass.
      timeout-minutes: 20

      steps:
        - name: Check out HEAD
          uses: actions/checkout@v4

        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
            node-version: "24"
            cache: "npm"

        - name: Install dependencies
          run: npm ci

        # playwright.config.js declares two projects: chromium AND
        # mobile-safari (WebKit, iPhone 14 Pro emulation). `npm run
        # test:e2e` runs both, so we install both browser binaries.
        # If you ever rip out the mobile-safari project, you can drop
        # `webkit` from this list to shave ~30s off the install step.
        - name: Install Playwright browsers (chromium + webkit)
          run: npx playwright install --with-deps chromium webkit

        - name: Wait for Vercel to roll the new build (push only)
          if: github.event_name == 'push'
          run: |
            echo "Sleeping 90s to let Vercel deploy the new commit before we probe..."
            sleep 90

        - name: Run smoke suite
          env:
            PLAYWRIGHT_BASE_URL: ${{ inputs.target_url || 'https://www.getroadwave.com' }}
          run: npm run test:e2e

        - name: Upload Playwright report on failure
          if: failure()
          uses: actions/upload-artifact@v4
          with:
            name: playwright-report-${{ github.run_id }}
            path: playwright-report/
            if-no-files-found: ignore
            retention-days: 14

        - name: Upload Playwright traces on failure
          if: failure()
          uses: actions/upload-artifact@v4
          with:
            name: playwright-traces-${{ github.run_id }}
            path: test-results/
            if-no-files-found: ignore
            retention-days: 14
