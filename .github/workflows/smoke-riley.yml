 # Run the Riley popup smoke test against Vercel preview deployments.
  #
  # Vercel's GitHub integration creates a Deployment + DeploymentStatus
  # for every push. When a preview deploy reports state=success, this
  # workflow checks out the exact commit Vercel built, installs deps +
  # Chromium, and runs scripts/test-riley-popup-on-home.mjs against the
  # preview URL surfaced as `deployment_status.target_url`.
  #
  # Production deployments are skipped here — the production smoke runs
  # locally before the manual `vercel --prod` (see README) and we don't
  # want PR-triggered smoke runs hitting the live site.
  #
  # Required repo secrets (Settings → Secrets and variables → Actions):
  #   NEXT_PUBLIC_SUPABASE_URL       — same value as the Vercel env var
  #   SUPABASE_SERVICE_ROLE_KEY      — admin key, used to create + tear
  #                                    down the throwaway smoke user

  name: smoke-riley

  on:
    deployment_status:

  concurrency:
    # Cancel any in-flight smoke run for the same deployment when a new
    # status update arrives (e.g. queued → building → success).
    group: smoke-riley-${{ github.event.deployment.id }}
    cancel-in-progress: true

  jobs:
    riley-popup:
      # Only run on successful, non-production deploys. We skip
      # Production explicitly rather than matching a specific Preview
      # label because Vercel has shipped a few different formats over the
      # years ("Preview", "Preview – <project>", etc.) and we don't want
      # the filter to silently start letting nothing through if the label
      # changes again.
      if: >-
        github.event.deployment_status.state == 'success' &&
        github.event.deployment.environment != 'Production' &&
        github.event.deployment_status.target_url != ''
      runs-on: ubuntu-latest
      timeout-minutes: 8

      steps:
        - name: Check out the commit Vercel built
          uses: actions/checkout@v4
          with:
            # Vercel deploys this exact SHA — test the code that actually
            # shipped, not whatever HEAD looks like now.
            ref: ${{ github.event.deployment.sha }}

        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '24'
            cache: 'npm'

        - name: Install dependencies
          run: npm ci

        - name: Install Chromium for Playwright
          run: npx playwright install --with-deps chromium

        - name: Run Riley popup smoke test against the preview URL
          env:
            # Test reads this and overrides the default https://www.getroadwave.com.
            SMOKE_SITE_URL: ${{ github.event.deployment_status.target_url }}
            NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          run: node scripts/test-riley-popup-on-home.mjs VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

        - name: Upload screenshots on failure
          if: failure()
          uses: actions/upload-artifact@v4
          with:
            name: riley-smoke-screenshots-${{ github.run_id }}
            path: test-results/
            if-no-files-found: ignore
            retention-days: 7
